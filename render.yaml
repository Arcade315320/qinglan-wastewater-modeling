services:
  - type: web
    name: qinglan-wastewater-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: MODAL_SIMULATION_URL
        sync: false
      - key: MODAL_AUTH_TOKEN
        sync: false
      - key: SIMULATION_TIMEOUT_SECONDS
        value: "880"
      - key: DATABASE_URL
        fromDatabase:
          name: qinglan-wastewater-db
          property: connectionString

databases:
  - name: qinglan-wastewater-db
    plan: basic-256mb
    region: singapore
    databaseName: qinglan_wastewater
    user: qinglan_app
    postgresMajorVersion: "18"
    ipAllowList: []
