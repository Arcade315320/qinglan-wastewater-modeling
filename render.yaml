services:
  - type: web
    name: qinglan-wastewater-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: MODAL_SIMULATION_URL
        sync: false
      - key: MODAL_AUTH_TOKEN
        sync: false
