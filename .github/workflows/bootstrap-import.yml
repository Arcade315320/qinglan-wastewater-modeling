name: Bootstrap source and deploy Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Restore complete project source
        run: |
          base64 --decode <<'ARCHIVE' > /tmp/qinglan-source.tar.gz
          
          ARCHIVE
          tar -xzf /tmp/qinglan-source.tar.gz
          mkdir -p frontend/public/assets
          mv wastewater-plant-entry.png frontend/public/assets/wastewater-plant-entry.png
          rm .github/workflows/bootstrap-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish wastewater modeling platform"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
